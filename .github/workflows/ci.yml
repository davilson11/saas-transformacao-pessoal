name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Não bloqueia por enquanto: há ~171 erros pré-existentes de lint
      # (114 no-explicit-any, 30 no-unescaped-entities, 20 set-state-in-effect).
      # Assim que o passivo for zerado, remova o continue-on-error.
      - name: Lint
        run: npx eslint .
        continue-on-error: true

      - name: Build
        run: npx next build
        env:
          # Valores fictícios: o build só precisa que as variáveis existam.
          # Os valores reais ficam na Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-ficticia-para-build
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ficticia
          CLERK_SECRET_KEY: sk_test_ficticia
